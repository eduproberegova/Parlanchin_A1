<title>Parlanchín · Español A1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Roboto+Condensed:wght@400;600;700&display=swap">
<style>
/* Layout: a game table — decks on the left, the drawn card centre stage, the scoreboard on the right; stacks to one column on phones. */
:root{
  --bg:#F4F7FB; --table:#E7EFF8; --paper:#FFFFFF; --ink:#1D1B22; --muted:#5E6472; --line:#D5DDE8;
  --accent:#F8395A; --accent-ink:#FFFFFF; --icy:#B3D1ED; --ok:#2E9E5B; --bad:#D8344A;
  --shadow:0 1px 0 rgba(29,27,34,.06),0 10px 28px -12px rgba(29,47,80,.28);
  --display:'Oswald','Arial Narrow','TeX Gyre Heros Cn',sans-serif;
  --text:'Roboto Condensed','Arial Narrow',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171D; --table:#1B2029; --paper:#232833; --ink:#EEF1F6; --muted:#A3ABBA; --line:#343B49;
  --accent:#FF5B78; --accent-ink:#1A0A0E; --icy:#2C4A66; --ok:#4CC27E; --bad:#FF6B7F;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 14px 30px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171D; --table:#1B2029; --paper:#232833; --ink:#EEF1F6; --muted:#A3ABBA; --line:#343B49;
  --accent:#FF5B78; --accent-ink:#1A0A0E; --icy:#2C4A66; --ok:#4CC27E; --bad:#FF6B7F;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 14px 30px -14px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.4;margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;padding-right:56px}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:12px;border-bottom:2px solid var(--accent)}
header.top img{width:54px;height:54px;flex:none}
img.logo{background:#fff;border-radius:50%}
.ttl{flex:1 1 240px;min-width:0}
.ttl h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,3.4vw,32px);line-height:1.05;margin:0;letter-spacing:.3px;text-wrap:balance}
.ttl h1 span{color:var(--accent)}
.ttl .slog{color:var(--ink)}
.ttl p{margin:2px 0 0;color:var(--muted);font-size:14px}
.tabs{display:flex;gap:4px;background:var(--table);padding:4px;border-radius:10px}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:7px;font-family:var(--display);font-weight:500;letter-spacing:.6px;text-transform:uppercase;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.side-handle{position:fixed;right:0;top:0;bottom:0;width:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--paper);border-left:1px solid var(--line);z-index:5;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
.side-handle span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--display);font-weight:600;letter-spacing:2px;color:var(--accent);font-size:14px}
.side-handle img{width:28px;height:28px}

.game{display:grid;grid-template-columns:230px minmax(0,1fr) 250px;gap:22px;margin-top:20px;align-items:start}
.panel h2{font-family:var(--display);font-size:13px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
.decks{display:flex;flex-direction:column;gap:10px}
.deck{position:relative;display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px 10px 10px;box-shadow:var(--shadow);transition:transform .15s}
.deck:hover{transform:translateX(3px)}
.deck .chipn{flex:none;width:36px;height:46px;border-radius:6px;background:var(--c);color:var(--cink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;box-shadow:3px 3px 0 -1px var(--paper),3px 3px 0 0 var(--c),6px 6px 0 -1px var(--paper),6px 6px 0 0 var(--c)}
.deck b{display:block;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.4px}
.deck small{display:block;color:var(--muted);font-size:12.5px;line-height:1.2}
.deck .left{margin-left:auto;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}
.deck.hot{outline:3px solid var(--c);outline-offset:2px}
.deck[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.dice-row{display:flex;gap:10px;align-items:center;margin-top:6px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:10px 14px;font-family:var(--display);font-weight:600;letter-spacing:.6px;text-transform:uppercase;font-size:14px;box-shadow:var(--shadow)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{box-shadow:none;background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.die{width:52px;height:52px;flex:none;border-radius:11px;background:var(--paper);border:2px solid var(--ink);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:7px;gap:2px}
.die i{width:9px;height:9px;border-radius:50%;background:var(--ink);place-self:center;visibility:hidden}
.die i.on{visibility:visible}
.die.roll{animation:roll .6s ease}
@keyframes roll{0%{transform:rotate(0)}50%{transform:rotate(200deg) scale(.85)}100%{transform:rotate(360deg)}}
.legend{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.legend span{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:3px}

.stage{min-width:0;display:flex;flex-direction:column;gap:14px}
.card{position:relative;background:var(--paper);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line);min-height:330px;display:flex;flex-direction:column;padding-right:44px}
.card.enter{animation:deal .35s cubic-bezier(.2,.8,.2,1)}
@keyframes deal{from{transform:translateY(16px) rotate(-1.5deg);opacity:.2}to{transform:none;opacity:1}}
.band{background:var(--c);color:var(--cink);display:flex;align-items:center;gap:10px;padding:10px 16px;margin-right:-44px}
.band .bn{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--cdeep);display:grid;place-items:center;font-family:var(--display);font-weight:700}
.band .bname{font-family:var(--display);font-weight:600;letter-spacing:2.4px;text-transform:uppercase;flex:1}
.band .num{font-variant-numeric:tabular-nums;font-size:14px;opacity:.95;margin-right:44px}
.card .strip{position:absolute;right:0;top:46px;bottom:0;width:44px;border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 0 10px}
.card .strip span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:1.4px;color:var(--accent)}
.card .strip img{width:30px;height:30px}
.cbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:26px 22px}
.instr{color:var(--muted);font-size:17px}
.instr.strong{color:var(--ink);font-weight:700;font-size:19px;max-width:30ch;text-wrap:balance}
.big{font-family:var(--display);font-weight:700;font-size:clamp(40px,7vw,64px);line-height:1;letter-spacing:1px}
.pchip{display:inline-flex;border:2px solid var(--c);border-radius:8px;overflow:hidden;font-size:16px}
.pchip b{background:var(--c);color:var(--cink);padding:5px 12px;letter-spacing:1px;font-family:var(--display);font-weight:600}
.pchip span{padding:5px 12px}
.pic{width:min(150px,36vw);aspect-ratio:1;color:var(--ink)}.pic svg{width:100%;height:100%}
.q{font-family:var(--display);font-weight:600;font-size:clamp(24px,3.6vw,34px);line-height:1.15;max-width:22ch;text-wrap:balance}
.hint{color:var(--muted);font-size:16px;border-top:1px solid var(--line);padding-top:8px}
.opts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.opt{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 18px;font-family:var(--display);font-weight:600;font-size:20px;min-width:110px}
.opt i{font-style:normal;color:var(--c2)}
.opt:hover{border-color:var(--c)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--paper))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--paper));text-decoration:line-through}
.typer{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.typer input{border:2px solid var(--line);border-radius:10px;padding:10px 14px;font-size:20px;width:min(260px,60vw);background:var(--paper)}
.fb{min-height:24px;font-weight:600;font-size:16px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.answer{background:var(--soft2);border-top:1px dashed var(--c);padding:12px 18px;margin-right:-44px;padding-right:62px;font-size:17px}
.answer b{font-family:var(--display);letter-spacing:1px;font-weight:600;text-transform:uppercase;font-size:13px;color:var(--cdeep);margin-right:8px}
.timer{height:8px;border-radius:5px;background:var(--table);overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);width:100%;transform-origin:left;transition:transform .25s linear}
.timer.out i{background:var(--bad)}
.trow{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.trow strong.out{color:var(--bad)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .grow{flex:1}

.score{display:flex;flex-direction:column;gap:10px}
.team{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;box-shadow:var(--shadow)}
.team.turn{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.team input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--display);font-weight:600;font-size:16px;padding:4px 2px}
.team .pts{font-family:var(--display);font-weight:700;font-size:28px;min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}
.team .mini{border:1px solid var(--line);background:transparent;border-radius:6px;width:26px;height:26px;padding:0;line-height:1}
.turnlbl{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:1px;text-transform:uppercase}
.opts-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--muted)}
.opts-row label{display:flex;gap:6px;align-items:center}
.hm{width:58px;height:58px;flex:none;margin-left:-6px}.hm svg{width:100%;height:100%}
.buddy{display:flex;align-items:center;gap:12px}
.bm{width:64px;height:64px;flex:none}.bm svg{width:100%;height:100%}
.bm.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.7) rotate(-8deg)}100%{transform:none}}
.bsay{position:relative;background:var(--paper);border:2px solid var(--icy);border-radius:14px 14px 14px 4px;padding:8px 14px;font-weight:600;font-size:16px;min-width:0}
.progress{font-size:13px;color:var(--muted)}

.browse{margin-top:20px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filters button{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:6px 14px;font-size:14px;display:flex;gap:6px;align-items:center}
.filters button span{width:10px;height:10px;border-radius:50%;background:var(--c)}
.filters button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mini-card{text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden;padding:0;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .15s}
.mini-card:hover{transform:translateY(-2px)}
.mini-card .mb{background:var(--c);color:var(--cink);font-family:var(--display);font-size:12px;letter-spacing:1.6px;padding:5px 10px;font-weight:600;display:flex;justify-content:space-between}
.mini-card .mc{padding:10px 12px;display:flex;gap:10px;align-items:center;min-height:64px;font-weight:600;font-size:15px}
.mini-card .mc svg{width:36px;height:36px;flex:none}
footer.foot{margin-top:28px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}
footer.foot b{color:var(--accent)}

@media (max-width:1020px){
  .game{grid-template-columns:minmax(0,1fr)}
  .stage{order:-1}
  .decks{flex-direction:row;flex-wrap:wrap}
  .deck{flex:1 1 170px}
  .score{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
}
@media (max-width:600px){
  .tabs{width:100%}.tabs button{flex:1}
  .wrap{padding-right:16px;padding-bottom:70px}
  .side-handle{top:auto;left:0;width:auto;height:38px;flex-direction:row;border-left:0;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .side-handle span{writing-mode:horizontal-tb;transform:none}
  .side-handle img{width:24px;height:24px}
  .deck small{display:none}
  .card{padding-right:0;min-height:300px}.band{margin-right:0}.band .num{margin-right:0}
  .card .strip{display:none}.answer{margin-right:0;padding-right:18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const pick = (a) => a[Math.floor(Math.random() * a.length)];
function say(mood, text){ const m = $('#bm'); m.innerHTML = MASC[mood]; m.classList.remove('pop'); void m.offsetWidth; m.classList.add('pop'); $('#bsay').textContent = text; }
const YAY = ['¡Olé!', '¡Genial!', '¡Muy bien!', '¡Fenomenal!', '¡Eres un crack!'];
const OOPS = ['¡Casi! La próxima vez.', '¡Ánimo! Tú puedes.', 'Uy… ¡otra vez será!'];
const DIE = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const strip = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '');
const norm = (s) => s.toLowerCase().trim().replace(/\s+/g, ' ').replace(/[.!¡¿?]/g, '');
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const S = {
  piles: {}, cur: null, shown: false, answered: false,
  teams: [{name:'Equipo 1', pts:0}, {name:'Equipo 2', pts:0}], turn: 0,
  t: 30, tLeft: 30, timerId: null, filter: 'all',
};
function deal(){ BLOCKS.forEach((b) => S.piles[b.id] = shuffle(b.cards.map((_, i) => i))); }
function vars(b){ const darkInk = b.id === 'conj'; return '--c:' + b.color + ';--cink:' + (darkInk ? b.ink : '#fff') + ';--cdeep:' + b.ink + ';--c2:' + b.color + ';--soft2:color-mix(in srgb,' + b.color + ' 14%, var(--paper))'; }

function renderDecks(hot){
  $('#decks').innerHTML = BLOCKS.map((b) => {
    const left = S.piles[b.id].length;
    return '<button class="deck' + (hot === b.id ? ' hot' : '') + '" style="' + vars(b) + '" data-b="' + b.id + '"' + (left ? '' : ' disabled') + '>' +
      '<span class="chipn">' + b.n + '</span><span><b>' + b.full + '</b><small>' + b.uk + '</small></span><span class="left">' + left + '/15</span></button>';
  }).join('');
  const total = BLOCKS.reduce((s, b) => s + S.piles[b.id].length, 0);
  $('#progress').textContent = 'Quedan ' + total + ' de 75 cartas';
}
function renderLegend(){
  $('#legend').innerHTML = BLOCKS.map((b) => '<span style="background:' + b.color + '"></span>' + b.n + ' = ' + b.name).join(' · ') + ' · 6 = comodín (eliges tú)';
}
function setDie(n){ const on = DIE[n] || []; $('#die').innerHTML = Array.from({length:9}, (_, i) => '<i class="' + (on.includes(i) ? 'on' : '') + '"></i>').join(''); $('#die').setAttribute('aria-label', 'Dado: ' + n); }

function cardHTML(b, i){
  const c = b.cards[i], num = b.n + '.' + String(i + 1).padStart(2, '0');
  let body = '';
  if (b.id === 'conj') {
    body = '<div class="instr">Conjuga el verbo:</div><div class="big">' + c.verb + '</div>' +
      '<div class="pchip"><b>' + c.person.toUpperCase() + '</b><span>' + (c.tense === 'IR A + infinitivo' ? 'Futuro: IR A + infinitivo' : c.tense) + '</span></div>' +
      '<form class="typer" id="typer"><input id="typed" autocomplete="off" spellcheck="false" placeholder="Escribe aquí…" aria-label="Tu respuesta"><button class="btn" type="submit">Comprobar</button></form><div class="fb" id="fb"></div>';
  } else if (b.id === 'img') {
    body = '<div class="instr strong">' + esc(c.task) + '</div><div class="pic">' + c.svg + '</div>';
  } else if (b.id === 'resp') {
    body = '<div class="q">' + esc(c.q) + '</div><div class="hint">' + esc(c.hint) + '</div>';
  } else if (b.id === 'test') {
    body = '<div class="instr">Elige la opción correcta:</div><div class="q">' + esc(c.q) + '</div><div class="opts">' +
      c.o.map((o, k) => '<button class="opt" data-k="' + k + '"><i>' + 'abc'[k] + ')</i> ' + esc(o) + '</button>').join('') + '</div><div class="fb" id="fb"></div>';
  } else {
    body = '<div class="q">' + esc(c.q) + '</div>';
  }
  return '<article class="card enter" style="' + vars(b) + '" aria-live="polite">' +
    '<div class="band"><span class="bn">' + b.n + '</span><span class="bname">' + b.name + '</span><span class="num">' + num + '</span></div>' +
    '<div class="cbody">' + body + '</div>' +
    '<div class="answer" id="ans" hidden><b>Respuesta</b>' + answerText(b, c) + '</div>' +
    '<div class="strip"><span>@eduproberegova</span><img class="logo" src="' + LOGO + '" alt=""></div></article>';
}
function answerText(b, c){
  if (b.id === 'test') return 'abc'[c.c] + ') ' + esc(c.o[c.c]);
  if (b.id === 'resp') return 'Por ejemplo: ' + esc(c.a);
  if (b.id === 'img') return 'Por ejemplo: ' + esc(c.a);
  return esc(c.a);
}

function showCard(bid, i){
  const b = BLOCKS.find((x) => x.id === bid);
  S.cur = {bid, i}; S.shown = false; S.answered = false;
  $('#card').innerHTML = cardHTML(b, i);
  $('#show').textContent = 'Ver respuesta';
  const f = $('#typer');
  if (f) f.addEventListener('submit', (e) => { e.preventDefault(); checkTyped(b.cards[i]); });
  document.querySelectorAll('.opt').forEach((btn) => btn.addEventListener('click', () => pickOpt(b.cards[i], +btn.dataset.k)));
  startTimer();
  if (S.teams.length) say('happy', pick(['¡Tu turno, ' + S.teams[S.turn].name + '!', '¡Venga, ' + S.teams[S.turn].name + '! ¡A charlar!', S.teams[S.turn].name + ', ¡tú puedes!']));
}
function draw(bid){
  const pile = S.piles[bid];
  if (!pile.length) return;
  const i = pile.shift();
  renderDecks(bid);
  showCard(bid, i);
}
function reveal(){ const a = $('#ans'); if (!a) return; S.shown = !S.shown; a.hidden = !S.shown; $('#show').textContent = S.shown ? 'Ocultar respuesta' : 'Ver respuesta'; }
function checkTyped(c){
  const v = $('#typed').value; const fb = $('#fb');
  if (!v.trim()) { fb.className = 'fb'; fb.textContent = 'Escribe la forma del verbo.'; return; }
  if (norm(v) === norm(c.a)) { fb.className = 'fb ok'; fb.textContent = '¡Muy bien! ' + c.a; stopTimer(); say('wow', pick(YAY)); }
  else if (strip(norm(v)) === strip(norm(c.a))) { fb.className = 'fb ok'; fb.textContent = 'Casi perfecto: revisa el acento → ' + c.a; stopTimer(); say('happy', '¡Casi perfecto! Ojo con el acento.'); }
  else { fb.className = 'fb bad'; fb.textContent = 'No es correcto. Inténtalo otra vez.'; say('oops', pick(OOPS)); }
}
function pickOpt(c, k){
  if (S.answered) return;
  S.answered = true; stopTimer();
  document.querySelectorAll('.opt').forEach((btn) => { const j = +btn.dataset.k; if (j === c.c) btn.classList.add('right'); else if (j === k) btn.classList.add('wrong'); });
  const fb = $('#fb');
  fb.className = 'fb ' + (k === c.c ? 'ok' : 'bad');
  fb.textContent = k === c.c ? '¡Correcto!' : 'Incorrecto. La respuesta es ' + 'abc'[c.c] + ') ' + c.o[c.c];
  if (k === c.c) say('wow', pick(YAY)); else say('oops', pick(OOPS));
}

function startTimer(){
  stopTimer();
  const on = $('#useTimer').checked;
  $('#timer').style.visibility = on ? 'visible' : 'hidden';
  $('#tnum').style.visibility = on ? 'visible' : 'hidden';
  S.t = +$('#secs').value; S.tLeft = S.t; paintTimer();
  if (!on) return;
  S.timerId = setInterval(() => { S.tLeft = Math.max(0, S.tLeft - 1); paintTimer(); if (!S.tLeft) { stopTimer(); say('oops', '¡Se acabó el tiempo!'); } }, 1000);
}
function stopTimer(){ clearInterval(S.timerId); S.timerId = null; }
function paintTimer(){
  $('#tbar').style.transform = 'scaleX(' + (S.tLeft / S.t) + ')';
  const out = S.tLeft === 0;
  $('#timer').classList.toggle('out', out);
  $('#tnum').textContent = out ? '¡Tiempo!' : S.tLeft + ' s';
  $('#tnum').className = out ? 'out' : '';
}

function renderTeams(){
  $('#teams').innerHTML = S.teams.map((t, k) =>
    '<div class="team' + (k === S.turn ? ' turn' : '') + '"><div style="flex:1;min-width:0">' + (k === S.turn ? '<div class="turnlbl">Tu turno</div>' : '') +
    '<input id="team-' + k + '" value="' + esc(t.name) + '" aria-label="Nombre del equipo ' + (k + 1) + '"></div>' +
    '<button class="mini" data-k="' + k + '" data-d="-1" aria-label="Quitar un punto">−</button><span class="pts">' + t.pts + '</span>' +
    '<button class="mini" data-k="' + k + '" data-d="1" aria-label="Añadir un punto">+</button></div>').join('');
  $('#turnTxt').textContent = 'Turno: ' + S.teams[S.turn].name;
  S.teams.forEach((t, k) => $('#team-' + k).addEventListener('input', (e) => { t.name = e.target.value || ('Equipo ' + (k + 1)); $('#turnTxt').textContent = 'Turno: ' + S.teams[S.turn].name; }));
  document.querySelectorAll('.team .mini').forEach((b) => b.addEventListener('click', () => { const t = S.teams[+b.dataset.k]; t.pts = Math.max(0, t.pts + +b.dataset.d); renderTeams(); }));
}
function nextTurn(point){
  if (point) S.teams[S.turn].pts++;
  S.turn = (S.turn + 1) % S.teams.length;
  renderTeams();
  const left = BLOCKS.filter((b) => S.piles[b.id].length);
  if (left.length) rollDice(); else { $('#card').innerHTML = '<article class="card" style="--c:var(--accent);--cink:#fff"><div class="band"><span class="bname">Fin del juego</span></div><div class="cbody"><div class="pic">' + MASC.wow + '</div><div class="q">¡Enhorabuena! Ya no quedan cartas.</div><div class="instr">' + winner() + '</div></div></article>'; stopTimer(); say('wow', '¡Qué partida! ' + winner()); }
}
function winner(){ const max = Math.max(...S.teams.map((t) => t.pts)); const w = S.teams.filter((t) => t.pts === max).map((t) => esc(t.name)); return (w.length > 1 ? 'Empate: ' : 'Gana: ') + w.join(', ') + ' (' + max + ')'; }

function rollDice(){
  const die = $('#die'); die.classList.remove('roll'); void die.offsetWidth; die.classList.add('roll');
  let n = 1 + Math.floor(Math.random() * 6);
  setDie(n);
  if (n === 6) { renderDecks(); $('#turnTxt').textContent = '¡Comodín! ' + S.teams[S.turn].name + ', elige un mazo.'; stopTimer(); say('wow', '¡Comodín! Elige el mazo que quieras.'); return; }
  let b = BLOCKS[n - 1];
  if (!S.piles[b.id].length) { const left = BLOCKS.filter((x) => S.piles[x.id].length); b = left[Math.floor(Math.random() * left.length)]; }
  setTimeout(() => draw(b.id), 350);
}

function renderBrowse(){
  $('#filters').innerHTML = '<button data-f="all" aria-pressed="' + (S.filter === 'all') + '">Todas (75)</button>' +
    BLOCKS.map((b) => '<button data-f="' + b.id + '" style="--c:' + b.color + '" aria-pressed="' + (S.filter === b.id) + '"><span></span>' + b.n + '. ' + b.full + '</button>').join('');
  document.querySelectorAll('#filters button').forEach((x) => x.addEventListener('click', () => { S.filter = x.dataset.f; renderBrowse(); }));
  const items = [];
  BLOCKS.forEach((b) => { if (S.filter !== 'all' && S.filter !== b.id) return; b.cards.forEach((c, i) => {
    const label = b.id === 'conj' ? c.verb + ' · ' + c.person : b.id === 'img' ? c.svg + '<span>' + esc(c.task) + '</span>' : esc(c.q);
    items.push('<button class="mini-card" style="' + vars(b) + '" data-b="' + b.id + '" data-i="' + i + '"><div class="mb"><span>' + b.name.toUpperCase() + '</span><span>' + b.n + '.' + String(i + 1).padStart(2, '0') + '</span></div><div class="mc">' + label + '</div></button>');
  }); });
  $('#grid').innerHTML = items.join('');
  document.querySelectorAll('.mini-card').forEach((m) => m.addEventListener('click', () => { tab('play'); showCard(m.dataset.b, +m.dataset.i); window.scrollTo({top:0, behavior:'smooth'}); }));
}
function tab(which){
  const play = which === 'play';
  $('#tab-play').setAttribute('aria-selected', play); $('#tab-all').setAttribute('aria-selected', !play);
  $('#view-play').hidden = !play; $('#view-all').hidden = play;
  if (!play) renderBrowse();
}

function start(){
  deal(); renderLegend(); renderTeams(); setDie(1);
  $('#decks').addEventListener('click', (e) => { const d = e.target.closest('.deck'); if (d && !d.disabled) draw(d.dataset.b); });
  $('#roll').addEventListener('click', rollDice);
  $('#show').addEventListener('click', reveal);
  $('#hit').addEventListener('click', () => nextTurn(true));
  $('#miss').addEventListener('click', () => nextTurn(false));
  $('#addTeam').addEventListener('click', () => { if (S.teams.length < 6) { S.teams.push({name:'Equipo ' + (S.teams.length + 1), pts:0}); renderTeams(); } });
  $('#delTeam').addEventListener('click', () => { if (S.teams.length > 1) { S.teams.pop(); S.turn = Math.min(S.turn, S.teams.length - 1); renderTeams(); } });
  $('#reset').addEventListener('click', () => { deal(); S.teams.forEach((t) => t.pts = 0); S.turn = 0; renderTeams(); draw('conj'); });
  $('#useTimer').addEventListener('change', startTimer);
  $('#secs').addEventListener('change', startTimer);
  $('#tab-play').addEventListener('click', () => tab('play'));
  $('#tab-all').addEventListener('click', () => tab('all'));
  draw('conj');
}
start();
</script>
</body></html>
